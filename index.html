<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>w03 Clicker Game</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./bongo.css" />
    <script src="./script.js" defer></script>
    <style>
      /* Test colours */
      .red {
        background-color: palevioletred;
      }
      .orange {
        background-color: orange;
      }
      .yellow {
        background-color: palegoldenrod;
      }
      .green {
        background-color: lightgreen;
      }
      .blue {
        background-color: cyan;
      }
      .indigo {
        background-color: cornflowerblue;
      }
      .violet {
        background-color: mediumpurple;
      }
    </style>
  </head>
  <body>
    <figure id="bongocat">
      <img src="./img/bongocat.jpg" />
      <figcaption class="rainbow">i love you, bongo cat</figcaption>
    </figure>
    <header><h1>w03 kitty clicker!</h1></header>
    <main id="clickerGame">
      <section id="mainView">
        <button id="sideViewBtn">Open panel</button>
        <h2>clicky!</h2>
        <button id="clickerButton" class="blue"></button>
        <div id="cpsCounter"></div>
        <div id="cookieCounter"></div>
      </section>
      <section id="sideView" class="hidden">
        <h2>shoppe!</h2>
        <div id="listContainer">
          <ul id="shopList"></ul>
        </div>
        <div>
          <p>
            <img src="./img/bongocat.jpg" style="width: 150px; height: 100px" />
            testing placeholder
          </p>
          <button id="clrBtn">clear stats!</button>
        </div>
      </section>
    </main>
    <footer>
      <div id="cheatBtns">
        <button id="cookiesUp" class="test red">test</button>
        <button id="powerUp" class="test yellow">test2</button>
        <button id="autoUp" class="test green">test3</button>
      </div>
    </footer>
  </body>
</html>
