<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>w03 Clicker Game</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./bongo.css" />
    <script src="./script.js" defer></script>
    <style>
      /* Test colours */
      .red {
        background-color: rgb(235, 174, 188);
      }
      .orange {
        background-color: rgb(255, 202, 187);
      }
      .yellow {
        background-color: lemonchiffon;
      }
      .green {
        background-color: rgb(200, 220, 190);
      }
      .blue {
        background-color: rgb(195, 222, 235);
      }
      .indigo {
        background-color: rgb(151, 171, 212);
      }
      .violet {
        background-color: rgb(225, 182, 219);
      }
    </style>
  </head>
  <body>
    <figure id="bongocat">
      <img src="./img/bongocat.jpg" />
      <figcaption class="rainbow">i love you, bongo cat</figcaption>
    </figure>
    <header><h1>w03 kitty clicker!</h1></header>
    <main id="clickerGame">
      <section id="mainView">
        <button id="sideViewBtn">Open panel</button>
        <h2>clicky!</h2>
        <button id="clickerButton" class="violet"></button>
        <div id="cpsCounter"></div>
        <div id="cookieCounter"></div>
      </section>
      <section id="sideView">
        <h2>shoppe!</h2>
        <div id="listContainer">
          <ul id="shopList" class="shop-list"></ul>
          <ul id="shopList2" class="shop-list"></ul>
        </div>
        <div>
          <p>
            <img src="./img/bongocat.jpg" style="width: 150px; height: 100px" />
            testing placeholder
          </p>
          <button id="clrBtn">clear stats!</button>
        </div>
      </section>
    </main>
    <footer>
      <div id="cheatBtns">
        <button id="cookiesUpSmall" class="test red">cookies+100</button>
        <button id="cookiesUp" class="test orange">cookies+10000</button>
        <button id="powerUp" class="test yellow">click+100</button>
        <button id="autoUp" class="test green">auto+10</button>
      </div>
    </footer>
  </body>
</html>
