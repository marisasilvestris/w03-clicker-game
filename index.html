<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>w03 Clicker Game</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./bongo.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <figure id="bongocat">
      <img src="./img/bongocat.jpg" />
      <figcaption>i love you, bongo cat</figcaption>
    </figure>
    <ul id="toastRack"></ul>
    <header><h1>w03 kitty clicker!</h1></header>
    <main id="clickerGame">
      <section id="mainView">
        <button id="sideViewBtn">shop!</button>
        <h2>clicky!</h2>
        <button id="clickerButton"></button>
        <p>Click Power: <span id="powerDisplay">0</span></p>
        <p>Units Per Second: <span id="cpsDisplay">0</span></p>
        <p>Fun Units: <span id="cookieDisplay">0</span></p>
      </section>
      <section id="sideView">
        <div id="headings">
          <!-- haha i had a problem but nobody can stop me just doing this -->
          <h3>auto power!</h3>
          <h2>shoppe!</h2>
          <h3>clicky power!</h3>
        </div>

        <div id="listContainer">
          <ul id="shopList" class="shop-list"></ul>
          <ul id="shopList2" class="shop-list"></ul>
        </div>
        <div class="bottom-spacer">
          <button id="clrBtn">clear stats!</button>
        </div>
      </section>
    </main>
    <footer>
      <div id="cheatBtns">
        <button id="cookiesUpSmall" class="test red">units+100</button>
        <button id="cookiesUp" class="test orange">units+10000</button>
        <button id="powerUp" class="test yellow">click+100</button>
        <button id="autoUp" class="test green">auto+10</button>
      </div>
    </footer>
  </body>
</html>
