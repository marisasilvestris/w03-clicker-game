<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>w03 Clicker Game</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./bongo.css" />
    <script src="./script.js" defer></script>
    <style>
      /* Test colours */
      .red {
        background-color: palevioletred;
      }
      .orange {
        background-color: orange;
      }
      .yellow {
        background-color: palegoldenrod;
      }
      .green {
        background-color: lightgreen;
      }
      .blue {
        background-color: cyan;
      }
      .indigo {
        background-color: cornflowerblue;
      }
      .violet {

      }
    </style>

  <body>
    <figure id="bongocat">
      <img src="./img/bongocat.jpg" />
      <figcaption class="rainbow">i love you, bongo cat</figcaption>
    </figure>
    <header><h1>w03 kitty clicker!</h1></header>
    <main id="clickerGame">
      <section id="mainView">
        <h2>clicky!</h2>
        <button id="clickerButton" class="blue"></button>
        <div id="counter"></div>
      </section>
      <section id="sideView">
        <h2>shoppe!</h2>
        <div id="listContainer">
          <ul id="shopList">
            <li><button class="red shop-item">item1</button></li>
            <li><button class="green shop-item">item1</button></li>
            <li><button class="indigo shop-item">item1</button></li>
            <li><button class="red shop-item">item1</button></li>
            <li><button class="green shop-item">item1</button></li>
            <li><button class="indigo shop-item">item1</button></li>
            <li><button class="red shop-item">item1</button></li>
            <li><button class="green shop-item">item1</button></li>
            <li><button class="indigo shop-item">item1</button></li>
            <li><button class="red shop-item">item1</button></li>
            <li><button class="green shop-item">item1</button></li>
            <li><button class="indigo shop-item">item1</button></li>
          </ul>
        </div>
        <div>
          <p>
            <img src="./img/bongocat.jpg" style="width: 150px; height: 150px" />
            testing placeholder
          </p>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
